name: Cache Wikimedia portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-images.yml'

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portraits
        run: |
          set -e
          mkdir -p images
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Jacques-Louis%20David%20-%20The%20Emperor%20Napoleon%20in%20His%20Study%20at%20the%20Tuileries%20-%20Google%20Art%20Project%202.jpg?width=900' \
            -o images/napoleon.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Melchior%20Lorck%20Sultan%20Suleiman.jpg?width=900' \
            -o images/suleiman.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://upload.wikimedia.org/wikipedia/commons/1/10/Theodor_Herzl_portrait.jpg' \
            -o images/herzl.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://upload.wikimedia.org/wikipedia/commons/b/b9/Abraham_Lincoln_standing_portrait_1863.jpg' \
            -o images/lincoln.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Head%20and%20shoulders%20crop%20of%20George%20Washington%20as%20President%20in%201796%20painted%20by%20Gilbert%20Stuart.jpg?width=900' \
            -o images/washington.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait%20of%20Queen%20Victoria.jpg?width=900' \
            -o images/victoria.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Portrait%20of%20Marie%20Curie.jpg?width=900' \
            -o images/curie.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sir%20Isaac%20Newton%20by%20Sir%20Godfrey%20Kneller%2C%20Bt.jpg?width=900' \
            -o images/newton.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Elizabeth%20I%20of%20England%20-%20coronation%20portrait.jpg?width=900' \
            -o images/elizabeth1.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Julius%20Caesar.jpg?width=900' \
            -o images/caesar.jpg

      - name: Verify files
        run: |
          for f in napoleon suleiman herzl lincoln washington victoria curie newton elizabeth1 caesar; do
            test -s "images/$f.jpg"
          done
          file images/*

      - name: Commit portraits to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Cache ten historical portraits locally'
            git push
          fi
